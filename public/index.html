<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Sign in / create account -->
  <main id="auth-view" class="auth" hidden>
    <form id="auth-form" class="auth-card">
      <h1>Taskboard</h1>
      <p id="auth-sub">Sign in to see your tasks.</p>
      <label id="name-field" hidden>Name <input name="name" autocomplete="name"></label>
      <label>Email <input name="email" type="email" required autocomplete="email"></label>
      <label>Password <input name="password" type="password" minlength="8" required autocomplete="current-password"></label>
      <p id="auth-error" class="error" role="alert"></p>
      <button class="btn primary" id="auth-submit">Sign in</button>
      <button type="button" class="link" id="auth-toggle">New here? Create an account</button>
    </form>
  </main>

  <!-- Board -->
  <div id="app-view" hidden>
    <header class="top">
      <h1>Taskboard</h1>
      <span id="live" class="live" title="Live updates">Offline</span>
      <span class="spacer"></span>
      <span id="who"></span>
      <button class="btn" id="add-btn">Add task</button>
      <button class="btn ghost" id="logout-btn">Sign out</button>
    </header>
    <main class="board" id="board"></main>
  </div>

  <dialog id="task-dialog">
    <form id="task-form" method="dialog">
      <h2 id="dialog-title">Add task</h2>
      <label>Title <input name="title" required maxlength="200"></label>
      <label>Details <textarea name="description" rows="3"></textarea></label>
      <div class="row">
        <label>Priority
          <select name="priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select>
        </label>
        <label>Due date <input name="due_date" type="date"></label>
      </div>
      <div class="actions">
        <button type="button" class="btn ghost" id="cancel-btn">Cancel</button>
        <button class="btn primary" id="save-btn">Save task</button>
      </div>
    </form>
  </dialog>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
